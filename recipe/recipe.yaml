context:
  version: "2.1.1"
  # experimental branch: main's build number + 100
  build_number: 103

  # ELF machine token `file` prints for the target; checked by the arch test
  elf_arch: ${{ "x86-64" if target_platform == "linux-64" else "aarch64" if target_platform == "linux-aarch64" else "PowerPC" if target_platform == "linux-ppc64le" else "RISC-V" if target_platform == "linux-riscv64" else "S/390" if target_platform == "linux-s390x" else "" }}
  # ocaml_win-64 ships gcc_* and vs2022_* at the same version/build; name the track.
  c_toolchain: ${{ "" if unix else c_compiler ~ "_*" }}
  library: ${{ "Library/" if not unix else "" }}
  m2: ${{ "m2-" if not unix else "" }}

package:
  name: ocaml-cmdliner
  version: ${{ version }}

source:
  url: https://erratique.ch/software/cmdliner/releases/cmdliner-${{ version }}.tbz
  sha256: 05b938d1def4f54c478178f1982822834510431ed98f2ac67cb4d90aa120d6b6

build:
  number: ${{ build_number }}
  string: ${{ c_compiler ~ "_" if not unix }}h${{ hash }}_${{ build_number }}
  script: build.sh

requirements:
  build:
    - ${{ compiler("ocaml") }}
    - if: not unix and c_compiler == "gcc"
      then:
        - ${{ stdlib("m2w64_c") }}
      else:
        - ${{ stdlib("c") }}
    # ocaml_win-64 >=14 only run-constrains the C compiler; activate it here, once (vs2022, zig)
    - if: not unix and c_compiler != "gcc"
      then:
        - ${{ compiler("c") }}
    # compiler("ocaml") renders no toolchain track; name it on windows
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
    # the cross compiler does not pull the native one; the build runs OCaml on the build machine
    - if: build_platform != target_platform and unix
      then:
        - ocaml_${{ build_platform }} ${{ ocaml_compiler_version }}.*
        # the cross compiler activates itself (shims, OCAMLLIB, host OCAMLPATH)
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.*
    # windows cross: the self-contained gcc track needs no vcvars
    - if: build_platform != target_platform and not unix
      then:
        - ocaml_${{ build_platform }} ${{ ocaml_compiler_version }}.* gcc_*
    - ${{ m2 }}make
    # build.sh runs under MSYS2 bash; the Makefile calls install(1)
    - if: not unix
      then:
        - ${{ m2 }}bash >=5.2
        - ${{ m2 }}coreutils
  host:
    # library: ocaml's run_export pins the compiler patch version
    - ocaml ${{ ocaml_compiler_version }}.*
    # the noarch ocaml metapackage does not pin the windows toolchain track
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}
  # the ocaml run_export does not encode the windows toolchain track
  run_constraints:
    - if: not unix
      then:
        - ocaml_${{ target_platform }} ${{ ocaml_compiler_version }}.* ${{ c_toolchain }}

tests:
  - package_contents:
      strict: true
      files:
        - ${{ library }}bin/cmdliner${{ ".exe" if not unix }}
        - ${{ library }}lib/ocaml/cmdliner/*
        - ${{ library }}share/bash-completion/completions/*
        - ${{ library }}share/zsh/site-functions/*
        - ${{ library }}share/powershell/*
  # cross lanes test under qemu binfmt, which would also run a build-machine
  # binary; check the native objects' ELF headers name the target instead
  - if: linux
    then:
      script:
        # test scripts are not jinja-rendered; hand the token over by env
        env:
          ELF_ARCH: ${{ elf_arch }}
        content:
          - set -eu
          - found=0
          - tmp="$(mktemp -d)"
          - |
            for a in $(find "${PREFIX}/lib/ocaml/cmdliner" -name '*.a'); do
              found=1
              d="${tmp}/$(basename "$a" .a)"
              mkdir -p "$d"
              (cd "$d" && ar x "$a")
              out="$(find "$d" -name '*.o' -exec file -L {} +)"
              echo "$out"
              if echo "$out" | grep -v "${ELF_ARCH}" | grep -q .; then echo "wrong arch in $a"; exit 1; fi
            done
          - test "$found" = 1
          - |
            for s in "${PREFIX}"/lib/ocaml/stublibs/dll*cmdliner*.so; do
              [ -e "$s" ] || continue
              file -L "$s"
              file -L "$s" | grep -q "${ELF_ARCH}"
            done
      requirements:
        build:
          - file
          - binutils

about:
  homepage: https://erratique.ch/software/cmdliner
  repository: https://github.com/dbuenzli/cmdliner
  documentation: https://erratique.ch/software/cmdliner/doc
  summary: Declarative definition of command line interfaces for OCaml
  license: ISC
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - ManuelLerchner
    - MementoRC
