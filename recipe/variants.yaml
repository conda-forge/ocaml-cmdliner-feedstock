# Local override: gives windows x86_64 two toolchain lanes (vs/gcc) and win-arm64 a zig lane.
c_compiler:
  - if: not unix and x86_64
    then:
      - vs
      - gcc
  - if: not unix and arm64
    then:
      - zig

# experimental branch: build against and publish to the ocaml_vs label
channel_sources:
  - conda-forge/label/ocaml_vs,conda-forge
channel_targets:
  - conda-forge ocaml_vs

ocaml_compiler_version:
  - 5.5.2
